<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Orders - Chatpata Bites</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
      .admin-shell {
        max-width: 1120px;
        margin: 0 auto;
        padding: 24px;
      }

      .admin-card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 20px;
        box-shadow: var(--shadow);
      }

      .admin-login {
        display: flex;
        gap: 10px;
        align-items: end;
        max-width: 520px;
        margin-bottom: 18px;
      }

      .orders-table {
        width: 100%;
        border-collapse: collapse;
      }

      .orders-table th,
      .orders-table td {
        border-bottom: 1px solid var(--line);
        padding: 10px;
        text-align: left;
        vertical-align: top;
      }

      .orders-table th {
        color: var(--muted);
        font-size: 0.78rem;
        text-transform: uppercase;
      }

      .order-items {
        margin: 0;
        padding-left: 18px;
      }

      .small-button {
        min-height: 34px;
        padding: 0 10px;
        font-size: 0.82rem;
      }

      .row-actions,
      .form-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .compact-label {
        gap: 5px;
        margin-bottom: 8px;
        font-size: 0.78rem;
      }

      textarea {
        font: inherit;
        width: 100%;
        min-height: 100px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 10px 11px;
        background: #ffffff;
        color: var(--ink);
        resize: vertical;
      }

      textarea:focus {
        border-color: var(--accent);
        outline: 3px solid rgba(20, 108, 95, 0.14);
      }

      .amount-edit-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(96px, 1fr));
        gap: 8px;
      }

      .gmail-panel {
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        padding: 16px 0;
        margin: 18px 0;
      }

      .gmail-panel p {
        color: var(--muted);
        margin: 8px 0 12px;
      }

      @media (max-width: 760px) {
        .admin-login {
          display: grid;
        }

        .orders-table {
          display: block;
          overflow-x: auto;
        }
      }
    </style>
  </head>
  <body>
    <main class="admin-shell">
      <section class="admin-card">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Admin</p>
            <h1>Order History</h1>
          </div>
          <a href="/">Receipt maker</a>
        </div>

        <form id="adminLogin" class="admin-login">
          <label>
            Admin password
            <input id="adminPassword" type="password" autocomplete="current-password" required>
          </label>
          <label>
            Month
            <input id="reportMonth" type="month" required>
          </label>
          <button type="submit">View orders</button>
        </form>

        <div id="messageBox" class="message-box" role="status" aria-live="polite" hidden></div>
        <div id="summaryView" class="summary-grid"></div>

        <section id="gmailPanel" class="gmail-panel" hidden>
          <h2>Gmail Payment Detection</h2>
          <p id="gmailStatus">Checking Gmail...</p>
          <div class="form-actions">
            <button id="connectGmail" type="button" class="secondary">Connect Gmail</button>
            <button id="disconnectGmail" type="button" class="secondary" hidden>Disconnect Gmail</button>
          </div>
        </section>

        <form id="supplierForm" class="supplier-form" hidden>
          <h2 id="supplierFormTitle">Supplier Payment Record</h2>
          <div class="grid two">
            <label>
              Supplier name
              <input id="supplierName" type="text" placeholder="Who you bought from">
            </label>
            <label>
              Date
              <input id="transactionDate" type="date">
            </label>
            <label>
              Total amount
              <input id="totalAmount" type="number" min="0" step="0.01" value="0">
            </label>
            <label>
              Paid amount
              <input id="paidAmount" type="number" min="0" step="0.01" value="0">
            </label>
          </div>
          <label>
            Items / notes
            <input id="itemDetails" type="text" placeholder="Example: chicken, eggs, masala">
          </label>
          <label>
            Extra note
            <input id="supplierNotes" type="text" placeholder="Paid full, baki, online, cash">
          </label>
          <div class="form-actions">
            <button id="supplierSubmitButton" type="submit">Save supplier record</button>
            <button id="cancelSupplierEdit" class="secondary" type="button" hidden>Cancel edit</button>
          </div>
        </form>

        <h2 class="admin-section-title">Daily Records</h2>
        <div id="dailyView"></div>

        <h2 class="admin-section-title">Supplier Records</h2>
        <div id="supplierView"></div>

        <h2 class="admin-section-title">Sell Records</h2>
        <div id="ordersView"></div>
      </section>
    </main>

    <script src="/admin.js"></script>
  </body>
</html>
